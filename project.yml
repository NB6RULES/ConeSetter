name: ConeSetter
options:
  bundleIdPrefix: com.nb6rules
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ConeSetter:
    type: application
    platform: iOS
    sources:
      - path: ConeSetter
        excludes:
          - "Resources/Viewer/**"
      - path: ConeSetter/Resources/Viewer
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Cone Setter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Cone Setter uses the camera and LiDAR to show where each cone goes on the ground.
        NSLocationWhenInUseUsageDescription: Cone Setter uses GPS to record speed runs and to tag saved track layouts with the site location.
        NSMotionUsageDescription: Cone Setter uses the motion sensors and barometer for 10 Hz speed, g-force and elevation logging.
        UIBackgroundModes: [location]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D model or CAD file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.nb6rules.conesetter.cad
              - public.3d-content
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.nb6rules.conesetter.cad
            UTTypeDescription: 3D model or CAD file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: ["step", "stp", "iges", "igs", "brep", "brp", "fcstd", "3dm", "dxf", "stl", "obj", "ply", "off", "3mf", "amf", "gltf", "glb", "fbx", "dae", "3ds", "wrl", "bim", "sldprt", "sldasm", "slddrw", "catpart", "catproduct", "cgr", "f3d", "f3z", "ipt", "iam", "prt", "asm", "par", "psm", "x_t", "x_b", "sat", "sab", "dwg", "jt", "skp", "3dxml", "blend"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nb6rules.conesetter
        PRODUCT_NAME: ConeSetter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
