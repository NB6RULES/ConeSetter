name: Build Windows analyzer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Core tests
        run: python tests/test_core.py

      - name: Build exe
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(256,256),(64,64),(48,48),(32,32),(16,16)])"
          pyinstaller --noconfirm --clean --onefile --windowed --name OBRA-Run-Analyzer `
            --icon icon.ico --add-data "icon.png;." `
            --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module PyQt5 --exclude-module PyQt6 `
            run_analyzer.py
          Get-Item dist\OBRA-Run-Analyzer.exe | Format-List Name, Length

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\OBRA-Run-Analyzer.exe" -ArgumentList "--selftest","selftest-out","sample\demo-runs.zip" -Wait -PassThru
          Get-Content selftest-out\selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import analyzer; print(analyzer.__version__)"
          $tag = "analyzer-v$v-b${{ github.run_number }}"
          Copy-Item sample\demo-runs.zip demo-runs.zip
          gh release create $tag "dist\OBRA-Run-Analyzer.exe" demo-runs.zip selftest-out\selftest-run.png selftest-out\selftest-compare.png selftest-out\selftest.txt `
            --title "OBRA Run Analyzer $v for Windows (build ${{ github.run_number }})" `
            --notes "Windows app to play back and analyse speed runs from the phone app. Download OBRA-Run-Analyzer.exe and run it; demo-runs.zip is sample data to try." `
            --latest=false --target $env:GITHUB_SHA
