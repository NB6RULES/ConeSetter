name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "source.json"
      - "README.md"
      - "docs/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          mkdir -p Support
          xcodegen generate

      - name: Logic tests (fusion + Excel export)
        run: |
          mkdir -p harness-out
          set -o pipefail
          { xcrun swiftc -O -module-name Harness ConeSetter/Speed/Core/*.swift Tests/Harness/main.swift -o harness-bin 2>&1 \
            && ./harness-bin harness-out 2>&1; } | tee harness-out/harness.log

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ConeSetter.xcodeproj \
            -target ConeSetter \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > xcodebuild.log 2>&1 || {
              echo "::group::Compiler errors"
              grep -E "error:|fatal error" xcodebuild.log | sort -u | head -100
              echo "::endgroup::"
              tail -60 xcodebuild.log
              exit 1
            }
          grep -E "warning:" xcodebuild.log | sort -u | head -40 || true
          test -d build/Release-iphoneos/ConeSetter.app

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/ConeSetter.app Payload/
          zip -qry ConeSetter.ipa Payload
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/ConeSetter.app/Info.plist)
          BUILD=${{ github.run_number }}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION-b$BUILD" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -f%z ConeSetter.ipa)" >> "$GITHUB_ENV"
          ls -la ConeSetter.ipa

      - name: Publish CI outputs (ci-test pre-release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p harness-out
          if [ -f xcodebuild.log ]; then
            grep -E "error:|warning:" xcodebuild.log | sort -u > harness-out/build-diagnostics.txt || true
            tail -200 xcodebuild.log > harness-out/xcodebuild-tail.txt
          fi
          echo "${GITHUB_SHA} ${{ job.status }}" > harness-out/commit.txt
          gh release view ci-test >/dev/null 2>&1 || gh release create ci-test --prerelease \
            --title "CI test outputs" --notes "Outputs of the latest CI run (logic tests, sample Excel export). Not an app release." \
            --target "$GITHUB_SHA"
          gh release upload ci-test harness-out/* --clobber

      - name: Publish GitHub release
        if: ${{ !contains(github.event.head_commit.message, '[no release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%s)
          gh release create "$TAG" ConeSetter.ipa \
            --title "Cone Setter $VERSION (build $BUILD)" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Update SideStore source
        if: ${{ !contains(github.event.head_commit.message, '[no release]') }}
        run: |
          python3 scripts/update_source.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --size "$SIZE" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ConeSetter.ipa" \
            --notes "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "source.json: $VERSION build $BUILD [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
