<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Viewer</title>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0e11;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; outline: none; }
    /* The engine adds its own plain progress text; the app shows a native one instead. */
    #stage > div { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="o3dv.min.js"></script>
<script src="dxf.js"></script>
<script src="viewer.js"></script>
</body>
</html>
